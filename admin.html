<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#102637">
<title>مدیریت وقت‌های مشاوره | ولوم هاوس</title>
<link rel="icon" href="assets/media/crest-ink.webp" type="image/webp"><link rel="stylesheet" href="assets/house.css?v=10">
<script defer src="assets/config.js?v=10"></script><script type="module" src="assets/admin.js?v=10"></script>
</head><body>
<header class="mast admin-mast"><div class="mast-inner"><a class="wordmark" id="admin-home" href="index.html"><img width="48" height="48" src="assets/media/crest-gold.webp" alt=""><span data-text="brand">ولوم هاوس</span></a>
<div class="admin-tools"><button type="button" id="admin-lang" class="language-control" lang="en">English</button>
<button type="button" id="signout" class="btn gold" hidden data-text="signout"></button></div></div></header>
<main class="admin-wrap"><div class="page-head"><h1 data-text="title">مدیریت وقت‌های مشاوره</h1></div>
<section id="login" class="paper admin-login"><h2 data-text="login">ورود همکاران</h2>
<form id="login-form" class="admin-form"><label><span data-text="key">کلید دسترسی</span><input type="password" id="staff-key" name="key" dir="ltr" autocomplete="current-password" required></label><button class="btn solid" type="submit" data-text="signin">ورود</button></form></section>
<p id="admin-status" class="status" role="status" tabindex="-1"></p>
<div class="admin-panels" id="panels" hidden><section class="paper admin-card"><h2 data-text="avail"></h2><p class="subtle" data-text="rules"></p>
<form id="open-form"><div class="admin-form"><label><span data-text="date"></span><input type="date" id="staff-date" name="day" required></label>
<label><span data-text="from"></span><select name="from" required></select></label><label><span data-text="until"></span><select name="until" required></select></label></div>
<button class="btn solid" type="submit" data-text="publish"></button></form><h3 data-text="open"></h3><ul class="admin-list" id="open-times"></ul></section>
<section class="paper admin-card"><div class="admin-heading"><h2 data-text="meetings"></h2><button type="button" id="refresh" class="text-button" data-text="refresh"></button></div>
<label><span data-text="show"></span> <select id="meeting-filter"><option value="upcoming" data-text="upcoming"></option><option value="past" data-text="past"></option><option value="all" data-text="all"></option></select></label>
<ul class="admin-list" id="meeting-list"></ul></section></div>
<noscript>برای مدیریت وقت‌ها جاوااسکریپت را فعال کنید. Enable JavaScript to manage the calendar.</noscript></main></body></html>
